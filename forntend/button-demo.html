<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ant Design Button Component — React + Tailwind CSS</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel Standalone for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f5f5f5] text-[#1f1f1f] font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, forwardRef } = React;

    // --- Loading Spinner Component ---
    const LoadingSpinner = ({ size = 'md' }) => {
      const sizeMap = {
        sm: 'w-3 h-3',
        md: 'w-3.5 h-3.5',
        lg: 'w-4.5 h-4.5',
      };

      return (
        <svg
          className={`animate-spin ${sizeMap[size] || sizeMap.md} shrink-0 text-current`}
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle
            className="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            strokeWidth="3.5"
          />
          <path
            className="opacity-80"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          />
        </svg>
      );
    };

    // --- Ant Design <Button> Component ---
    const Button = forwardRef((
      {
        variant = 'default',
        size = 'md',
        isLoading = false,
        icon,
        iconPosition = 'left',
        block = false,
        disabled = false,
        className = '',
        children,
        onClick,
        ...props
      },
      ref
    ) => {
      // Base Styles (inline-flex, font-medium, focus ring, disabled cursor)
      const baseStyles =
        'inline-flex items-center justify-center font-medium transition-all duration-200 ' +
        'focus:outline-none focus:ring-2 focus:ring-blue-500/30 ' +
        'disabled:cursor-not-allowed select-none active:scale-[0.99] gap-2';

      // Variants
      const variantStyles = {
        primary:
          'bg-[#1677ff] text-white shadow-sm shadow-blue-500/20 ' +
          'hover:bg-[#4096ff] ' +
          'active:bg-[#0958d9] ' +
          'disabled:bg-[#1677ff] disabled:opacity-60 disabled:shadow-none',
        default:
          'bg-white border border-gray-300 text-gray-700 shadow-sm shadow-black/5 ' +
          'hover:border-[#4096ff] hover:text-[#4096ff] hover:bg-white ' +
          'active:border-[#0958d9] active:text-[#0958d9] ' +
          'disabled:bg-gray-50 disabled:border-gray-200 disabled:text-gray-400 disabled:opacity-60',
        ghost:
          'bg-transparent text-gray-700 ' +
          'hover:bg-gray-100 hover:text-[#4096ff] ' +
          'active:bg-gray-200 active:text-[#0958d9] ' +
          'disabled:text-gray-400 disabled:opacity-60 disabled:hover:bg-transparent',
      };

      // Sizes
      const sizeStyles = {
        sm: 'px-3 py-1.5 text-xs rounded',
        md: 'px-4 py-2 text-sm rounded-md',
        lg: 'px-6 py-3 text-base rounded-lg',
      };

      const widthStyle = block ? 'w-full' : '';

      const buttonClasses = [
        baseStyles,
        variantStyles[variant] || variantStyles.default,
        sizeStyles[size] || sizeStyles.md,
        widthStyle,
        className,
      ]
        .filter(Boolean)
        .join(' ');

      const isDisabled = disabled || isLoading;

      return (
        <button
          ref={ref}
          disabled={isDisabled}
          aria-busy={isLoading}
          className={buttonClasses}
          onClick={onClick}
          {...props}
        >
          {isLoading ? (
            <LoadingSpinner size={size} />
          ) : (
            icon && iconPosition === 'left' && <span className="inline-flex shrink-0">{icon}</span>
          )}

          {children && <span>{children}</span>}

          {!isLoading && icon && iconPosition === 'right' && (
            <span className="inline-flex shrink-0">{icon}</span>
          )}
        </button>
      );
    });

    Button.displayName = 'Button';

    // Sample Icons
    const SearchIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    );

    const DownloadIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
    );

    const PlusIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
      </svg>
    );

    const ArrowRightIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
      </svg>
    );

    // --- Interactive Showcase App ---
    function App() {
      const [loading, setLoading] = useState(false);
      const [selectedVariant, setSelectedVariant] = useState('primary');
      const [selectedSize, setSelectedSize] = useState('md');
      const [showIcon, setShowIcon] = useState(true);
      const [disabled, setDisabled] = useState(false);

      return (
        <div className="p-6 sm:p-12">
          <div className="max-w-5xl mx-auto space-y-10">
            
            {/* Header */}
            <div className="border-b border-gray-200 pb-6 flex items-start justify-between flex-wrap gap-4">
              <div>
                <div className="flex items-center gap-3 mb-2">
                  <span className="w-7 h-7 rounded bg-[#1677ff] text-white flex items-center justify-center text-xs font-bold shadow-sm shadow-blue-500/30">
                    A
                  </span>
                  <h1 className="text-2xl sm:text-3xl font-bold tracking-tight text-gray-900">
                    Ant Design Button in React + Tailwind CSS
                  </h1>
                </div>
                <p className="text-gray-500 text-sm">
                  Replicating Ant Design v5 aesthetics with pure Tailwind utility classes: vibrant blue <code className="bg-gray-200 px-1 py-0.5 rounded text-xs">#1677ff</code>, hover <code className="bg-gray-200 px-1 py-0.5 rounded text-xs">#4096ff</code>, active <code className="bg-gray-200 px-1 py-0.5 rounded text-xs">#0958d9</code>.
                </p>
              </div>

              <div className="flex items-center gap-2">
                <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-blue-50 text-[#1677ff] border border-blue-200">
                  TypeScript Ready
                </span>
                <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                  Ant Design v5 Spec
                </span>
              </div>
            </div>

            {/* 1. All Variants */}
            <section className="bg-white rounded-xl p-6 sm:p-8 shadow-sm border border-gray-200/80 space-y-4">
              <h2 className="text-base font-semibold text-gray-900 flex items-center gap-2">
                <span>1. Variants</span>
                <span className="text-xs text-gray-400 font-normal">Primary, Default (Outline), Ghost (Text)</span>
              </h2>
              <div className="flex flex-wrap items-center gap-4 pt-2">
                <Button variant="primary">Primary Button</Button>
                <Button variant="default">Default Button</Button>
                <Button variant="ghost">Ghost Button</Button>
              </div>
            </section>

            {/* 2. All Sizes */}
            <section className="bg-white rounded-xl p-6 sm:p-8 shadow-sm border border-gray-200/80 space-y-4">
              <h2 className="text-base font-semibold text-gray-900 flex items-center gap-2">
                <span>2. Sizes</span>
                <span className="text-xs text-gray-400 font-normal">Small (sm), Medium (md), Large (lg)</span>
              </h2>
              <div className="space-y-4 pt-2">
                <div className="flex flex-wrap items-center gap-4">
                  <Button variant="primary" size="sm">Small (sm)</Button>
                  <Button variant="primary" size="md">Medium (md)</Button>
                  <Button variant="primary" size="lg">Large (lg)</Button>
                </div>
                <div className="flex flex-wrap items-center gap-4">
                  <Button variant="default" size="sm">Small (sm)</Button>
                  <Button variant="default" size="md">Medium (md)</Button>
                  <Button variant="default" size="lg">Large (lg)</Button>
                </div>
              </div>
            </section>

            {/* 3. Icon Support */}
            <section className="bg-white rounded-xl p-6 sm:p-8 shadow-sm border border-gray-200/80 space-y-4">
              <h2 className="text-base font-semibold text-gray-900 flex items-center gap-2">
                <span>3. Icon Support</span>
                <span className="text-xs text-gray-400 font-normal">Leading & Trailing icon with gap-2</span>
              </h2>
              <div className="flex flex-wrap items-center gap-4 pt-2">
                <Button variant="primary" icon={<SearchIcon />}>
                  Search
                </Button>
                <Button variant="default" icon={<DownloadIcon />}>
                  Download Report
                </Button>
                <Button variant="ghost" icon={<PlusIcon />}>
                  Add Component
                </Button>
                <Button variant="primary" icon={<ArrowRightIcon />} iconPosition="right">
                  Get Started
                </Button>
              </div>
            </section>

            {/* 4. Loading States */}
            <section className="bg-white rounded-xl p-6 sm:p-8 shadow-sm border border-gray-200/80 space-y-4">
              <div className="flex items-center justify-between flex-wrap gap-4">
                <div>
                  <h2 className="text-base font-semibold text-gray-900">4. Loading State (isLoading)</h2>
                  <p className="text-xs text-gray-500">
                    Disables interaction, replaces icon with spinning Tailwind SVG loader.
                  </p>
                </div>
                <Button 
                  variant="default" 
                  size="sm" 
                  onClick={() => setLoading(!loading)}
                >
                  Toggle Loading: <span className="font-bold text-[#1677ff] ml-1">{loading ? 'ON' : 'OFF'}</span>
                </Button>
              </div>

              <div className="flex flex-wrap items-center gap-4 pt-2">
                <Button variant="primary" isLoading={loading}>
                  Submit Payment
                </Button>
                <Button variant="default" isLoading={loading} icon={<DownloadIcon />}>
                  Export CSV
                </Button>
                <Button variant="ghost" isLoading={loading}>
                  Refreshing Data
                </Button>
                <Button variant="primary" size="sm" isLoading={true}>
                  Static Loading (sm)
                </Button>
              </div>
            </section>

            {/* 5. Disabled States */}
            <section className="bg-white rounded-xl p-6 sm:p-8 shadow-sm border border-gray-200/80 space-y-4">
              <h2 className="text-base font-semibold text-gray-900 flex items-center gap-2">
                <span>5. Disabled States</span>
                <span className="text-xs text-gray-400 font-normal">disabled:cursor-not-allowed disabled:opacity-60</span>
              </h2>
              <div className="flex flex-wrap items-center gap-4 pt-2">
                <Button variant="primary" disabled>
                  Primary Disabled
                </Button>
                <Button variant="default" disabled icon={<DownloadIcon />}>
                  Default Disabled
                </Button>
                <Button variant="ghost" disabled>
                  Ghost Disabled
                </Button>
              </div>
            </section>

            {/* 6. Interactive Playground */}
            <section className="bg-gradient-to-br from-white to-gray-50 rounded-xl p-6 sm:p-8 shadow-sm border border-gray-200/80 space-y-6">
              <div className="border-b border-gray-200 pb-4">
                <h2 className="text-base font-semibold text-gray-900">6. Interactive Playground</h2>
                <p className="text-xs text-gray-500">Test props dynamically and inspect generated behavior.</p>
              </div>

              {/* Controls */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs">
                <div>
                  <label className="block text-gray-500 font-medium mb-1.5">Variant</label>
                  <select
                    className="w-full bg-white border border-gray-300 rounded-md p-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
                    value={selectedVariant}
                    onChange={(e) => setSelectedVariant(e.target.value)}
                  >
                    <option value="primary">primary</option>
                    <option value="default">default</option>
                    <option value="ghost">ghost</option>
                  </select>
                </div>

                <div>
                  <label className="block text-gray-500 font-medium mb-1.5">Size</label>
                  <select
                    className="w-full bg-white border border-gray-300 rounded-md p-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
                    value={selectedSize}
                    onChange={(e) => setSelectedSize(e.target.value)}
                  >
                    <option value="sm">sm (Small)</option>
                    <option value="md">md (Medium)</option>
                    <option value="lg">lg (Large)</option>
                  </select>
                </div>

                <div className="flex flex-col justify-end">
                  <label className="flex items-center gap-2 cursor-pointer p-2 bg-white rounded-md border border-gray-300">
                    <input
                      type="checkbox"
                      checked={showIcon}
                      onChange={(e) => setShowIcon(e.target.checked)}
                      className="rounded text-[#1677ff] focus:ring-blue-500/30"
                    />
                    <span className="text-gray-700 font-medium">Show Icon</span>
                  </label>
                </div>

                <div className="flex flex-col justify-end">
                  <label className="flex items-center gap-2 cursor-pointer p-2 bg-white rounded-md border border-gray-300">
                    <input
                      type="checkbox"
                      checked={disabled}
                      onChange={(e) => setDisabled(e.target.checked)}
                      className="rounded text-[#1677ff] focus:ring-blue-500/30"
                    />
                    <span className="text-gray-700 font-medium">Disabled</span>
                  </label>
                </div>
              </div>

              {/* Live Preview Area */}
              <div className="p-8 rounded-lg bg-gray-100/70 border border-gray-200 flex flex-col items-center justify-center gap-3 min-h-[140px]">
                <Button
                  variant={selectedVariant}
                  size={selectedSize}
                  isLoading={loading}
                  disabled={disabled}
                  icon={showIcon ? <SearchIcon /> : undefined}
                  onClick={() => alert(`Clicked Ant Design <Button variant="${selectedVariant}" size="${selectedSize}">`)}
                >
                  Ant Design Button
                </Button>
                <div className="text-[11px] text-gray-400 font-mono">
                  &lt;Button variant="{selectedVariant}" size="{selectedSize}"{loading ? ' isLoading' : ''}{disabled ? ' disabled' : ''}&gt;
                </div>
              </div>
            </section>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
