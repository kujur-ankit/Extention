# Email Assistant Security Policy
role_name: email_assistant
description: Handles incoming emails and drafts replies. Cannot execute shell or access database.
default_action: DENY
allowed_tools:
  - list_emails
  - read_email
  - draft_reply

tool_rules:
  draft_reply:
    blocked_patterns:
      - "-----BEGIN"
      - "sk-[a-zA-Z0-9]{20,}"
      - "AKIA[0-9A-Z]{16}"
    max_payload_size: 16384
    requires_approval: true

max_tool_calls_per_turn: 10
require_hitl_for_elevated: true
